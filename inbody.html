<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>InBody Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f5f8f7;
    --surface: #fff;
    --surface2: #eef4f2;
    --text: #1f2b28;
    --text2: #6b7d78;
    --text3: #9fb0ab;
    --accent: #3f8f78;
    --accent-light: #e5f3ee;
    --accent-dark: #2f6e5c;
    --good: #3f8f78;
    --bad: #d9695f;
    --border: rgba(70,110,95,0.14);
    --border2: rgba(70,110,95,0.26);
    --shadow: rgba(40,70,60,0.10);
    --font-body: 'Noto Serif KR', serif;
    --font-ui: 'Noto Sans KR', sans-serif;
    --radius: 20px;
    --radius-sm: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131a18;
      --surface: #1c2523;
      --surface2: #182120;
      --text: #eaf2ef;
      --text2: #8ea299;
      --text3: #576863;
      --accent: #5fb69b;
      --accent-light: rgba(95,182,155,0.14);
      --accent-dark: #7bcbb1;
      --good: #5fb69b;
      --bad: #e08079;
      --border: rgba(140,190,175,0.12);
      --border2: rgba(140,190,175,0.22);
      --shadow: rgba(0,0,0,0.3);
    }
  }

  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); min-height: 100vh; overscroll-behavior: none; }

  /* 로그인 */
  .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 32px; text-align: center; }
  .login-icon { font-size: 52px; margin-bottom: 20px; }
  .login-title { font-family: var(--font-body); font-size: 26px; color: var(--text); margin-bottom: 10px; letter-spacing: 1px; }
  .login-sub { font-size: 15px; color: var(--text2); line-height: 1.6; margin-bottom: 40px; }
  .btn-google {
    display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-radius: var(--radius-sm);
    background: var(--surface); border: 1px solid var(--border2); color: var(--text); font-size: 16px;
    cursor: pointer; transition: all 0.15s; font-family: var(--font-ui);
  }
  .btn-google:active { transform: scale(0.97); }
  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* 로딩 */
  .loading-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px; }
  .spinner { width: 32px; height: 32px; border: 2.5px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--text3); }

  /* 헤더 */
  .app-header {
    position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .app-title { font-family: var(--font-body); font-size: 21px; color: var(--text); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .btn-icon {
    width: 34px; height: 34px; border-radius: 50%; background: none; border: 1px solid var(--border2);
    cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text3);
    font-size: 16px; transition: all 0.15s; flex-shrink: 0;
  }
  .btn-icon:active { background: var(--surface2); }
  .header-date { font-size: 13px; color: var(--text3); letter-spacing: 0.3px; }

  .content-wrap { padding: 20px 20px 40px; max-width: 640px; margin: 0 auto; }

  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; }
  .empty-text { font-family: var(--font-body); color: var(--text3); font-size: 16px; line-height: 1.6; }

  .btn-add {
    width: 100%; padding: 15px; border-radius: var(--radius-sm); background: var(--accent);
    border: none; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 18px;
    font-family: var(--font-ui); transition: background 0.15s, transform 0.12s;
  }
  .btn-add:active { transform: scale(0.98); background: var(--accent-dark); }

  /* 요약 카드 */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
  .metric-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; }
  .metric-value { font-family: var(--font-body); font-size: 22px; color: var(--text); }
  .metric-delta { font-size: 12px; margin-top: 4px; font-weight: 500; }
  .metric-delta.good { color: var(--good); }
  .metric-delta.bad { color: var(--bad); }
  .metric-delta.flat { color: var(--text3); }

  /* 차트 카드 */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; }
  .chart-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .chart-title { font-size: 14px; color: var(--text2); }
  .chart-latest { font-family: var(--font-body); font-size: 19px; color: var(--text); }
  .chart-svg { width: 100%; height: auto; display: block; }
  .chart-axis-label { font-size: 9px; fill: var(--text3); }

  /* 기록 리스트 */
  .history-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .history-title { font-size: 13px; color: var(--text3); margin-bottom: 12px; }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; }
  .history-date { font-size: 13px; color: var(--text); font-weight: 500; }
  .history-values { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .history-del { background: none; border: none; color: var(--text3); font-size: 15px; cursor: pointer; padding: 4px 8px; flex-shrink: 0; }
  .history-del:active { color: var(--bad); }

  /* 입력 패널 */
  .sheet-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
    z-index: 200; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: all; }
  .sheet {
    background: var(--bg); border-radius: 24px 24px 0 0; padding: 24px 20px;
    padding-bottom: max(24px, env(safe-area-inset-bottom)); width: 100%; max-width: 640px; margin: 0 auto;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(.32,.72,0,1);
  }
  .sheet-overlay.open .sheet { transform: translateY(0); }
  .sheet-title { font-family: var(--font-body); font-size: 18px; color: var(--text); margin-bottom: 20px; }
  .sheet-scroll { max-height: 65vh; overflow-y: auto; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text3); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--surface); color: var(--text); font-size: 16px; outline: none; font-family: var(--font-ui);
  }
  .field input:focus { border-color: var(--accent); }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .field-grid .field.full { grid-column: 1 / -1; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-cancel {
    flex: 1; padding: 14px; border-radius: var(--radius-sm); background: none; border: 1px solid var(--border2);
    color: var(--text3); font-size: 15px; cursor: pointer; font-family: var(--font-ui);
  }
  .btn-save {
    flex: 2; padding: 14px; border-radius: var(--radius-sm); background: var(--accent); border: none;
    color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font-ui);
    transition: background 0.15s, transform 0.12s;
  }
  .btn-save:active { transform: scale(0.98); background: var(--accent-dark); }

  /* 토스트 */
  .toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    font-size: 13px; padding: 8px 18px; border-radius: 999px; opacity: 0; transition: opacity 0.2s;
    pointer-events: none; z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="screenLoading" class="loading-screen">
  <div class="spinner"></div>
  <div class="loading-text">불러오는 중...</div>
</div>

<div id="screenLogin" class="login-screen" style="display:none">
  <div class="login-icon">⚖️</div>
  <h1 class="login-title">InBody Tracker</h1>
  <p class="login-sub">인바디 측정 결과를 기록하고<br>지표별 변화 추이를 확인해보세요.</p>
  <button class="btn-google" id="btnGoogleLogin">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Google로 로그인
  </button>
</div>

<div id="screenApp" style="display:none">
  <div class="app-header">
    <div class="header-top">
      <h1 class="app-title">⚖️ InBody</h1>
      <button class="btn-icon" id="btnLogout" title="로그아웃">↩</button>
    </div>
    <div class="header-date" id="headerDate"></div>
  </div>
  <div class="content-wrap" id="mainContent"></div>
</div>

<!-- 입력 패널 -->
<div class="sheet-overlay" id="inbodyPanel">
  <div class="sheet">
    <div class="sheet-title">인바디 기록 추가</div>
    <div class="sheet-scroll">
      <div class="field">
        <label>측정 날짜</label>
        <input type="date" id="inbodyDate">
      </div>
      <div class="field-grid">
        <div class="field"><label>체중 (kg)</label><input type="number" step="0.1" inputmode="decimal" id="inbodyWeight" placeholder="예: 65.5"></div>
        <div class="field"><label>골격근량 (kg)</label><input type="number" step="0.1" inputmode="decimal" id="inbodyMuscleMass" placeholder="예: 28.0"></div>
        <div class="field"><label>체지방량 (kg)</label><input type="number" step="0.1" inputmode="decimal" id="inbodyBodyFatMass" placeholder="예: 15.0"></div>
        <div class="field"><label>체지방률 (%)</label><input type="number" step="0.1" inputmode="decimal" id="inbodyBodyFatPercent" placeholder="예: 22.5"></div>
        <div class="field"><label>BMI</label><input type="number" step="0.1" inputmode="decimal" id="inbodyBmi" placeholder="예: 22.0"></div>
        <div class="field"><label>내장지방레벨</label><input type="number" step="1" inputmode="decimal" id="inbodyVisceralFat" placeholder="예: 7"></div>
        <div class="field full"><label>기초대사량 (kcal)</label><input type="number" step="1" inputmode="decimal" id="inbodyBmr" placeholder="예: 1450"></div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCloseInbody">취소</button>
      <button class="btn-save" id="btnSaveInbodyForm">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, deleteDoc, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCZ8GYafU6TKYw_uPQIKpE5s07rVDzrmHU",
  authDomain: "secret-6cef1.firebaseapp.com",
  projectId: "secret-6cef1",
  storageBucket: "secret-6cef1.firebasestorage.app",
  messagingSenderId: "27720129100",
  appId: "1:27720129100:web:ca6f0ff2864ac04b5032e9",
  measurementId: "G-JGPD8D9KVD"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const METRICS = [
  { key: 'weight',         label: '체중',         unit: 'kg',   color: '#c8856a', goodDirection: null },
  { key: 'muscleMass',     label: '골격근량',     unit: 'kg',   color: '#3f8f78', goodDirection: 'up' },
  { key: 'bodyFatMass',    label: '체지방량',     unit: 'kg',   color: '#d9695f', goodDirection: 'down' },
  { key: 'bodyFatPercent', label: '체지방률',     unit: '%',    color: '#e0955a', goodDirection: 'down' },
  { key: 'bmi',            label: 'BMI',          unit: '',     color: '#5a8fc8', goodDirection: null },
  { key: 'visceralFat',    label: '내장지방레벨', unit: '',     color: '#8f7ac8', goodDirection: 'down' },
  { key: 'bmr',            label: '기초대사량',   unit: 'kcal', color: '#c8a83f', goodDirection: 'up' },
];

let currentUser = null;
let records = [];

function colRef() { return collection(db, 'inbody', currentUser.uid, 'records'); }

function toast(msg, duration = 1800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function fmtDate(dateStr) { return (dateStr || '').replace(/-/g, '.'); }

async function loadRecords() {
  const q = query(colRef(), orderBy('date', 'asc'));
  const snap = await getDocs(q);
  records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function buildLineChart(sorted, metricKey, color) {
  const points = sorted.filter(r => r[metricKey] != null).map(r => ({ date: r.date, val: r[metricKey] }));
  if (!points.length) return `<div style="font-size:13px;color:var(--text3);padding:10px 0;text-align:center">데이터 없음</div>`;
  if (points.length === 1) return `<div style="font-size:13px;color:var(--text3);padding:10px 0;text-align:center">기록이 1개 더 있으면 추세가 표시돼요</div>`;
  const width = 300, height = 100, padding = 10, axisSpace = 16;
  const values = points.map(p => p.val);
  let min = Math.min(...values), max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const stepX = (width - padding * 2) / (points.length - 1);
  const coords = points.map((p, i) => ({
    x: padding + i * stepX,
    y: height - padding - ((p.val - min) / (max - min)) * (height - padding * 2),
    val: p.val, date: p.date,
  }));
  const linePath = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaPath = `${linePath} L${coords[coords.length - 1].x.toFixed(1)},${height - padding} L${coords[0].x.toFixed(1)},${height - padding} Z`;
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" style="fill:${color}"><title>${fmtDate(c.date)}: ${c.val}</title></circle>`).join('');
  return `
    <svg class="chart-svg" viewBox="0 0 ${width} ${height + axisSpace}">
      <path d="${areaPath}" style="fill:${color};opacity:0.14;stroke:none"/>
      <path d="${linePath}" style="fill:none;stroke:${color};stroke-width:2"/>
      ${dots}
      <text class="chart-axis-label" x="${padding}" y="${height + 13}">${fmtDate(coords[0].date)}</text>
      <text class="chart-axis-label" x="${width - padding}" y="${height + 13}" text-anchor="end">${fmtDate(coords[coords.length - 1].date)}</text>
    </svg>`;
}

function renderSummary(sorted) {
  const latest = sorted[sorted.length - 1];
  const prev = sorted.length > 1 ? sorted[sorted.length - 2] : null;
  const cards = METRICS.filter(m => latest[m.key] != null).map(m => {
    const val = latest[m.key];
    let deltaHtml = '';
    if (prev && prev[m.key] != null) {
      const diff = Math.round((val - prev[m.key]) * 100) / 100;
      const dir = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
      let cls = 'flat';
      if (diff !== 0 && m.goodDirection) cls = dir === m.goodDirection ? 'good' : 'bad';
      const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '–';
      deltaHtml = `<div class="metric-delta ${cls}">${arrow} ${Math.abs(diff)}${m.unit}</div>`;
    }
    return `<div class="metric-card">
      <div class="metric-label">${m.label}</div>
      <div class="metric-value">${val}${m.unit}</div>
      ${deltaHtml}
    </div>`;
  }).join('');
  return `<div class="summary-grid">${cards}</div>`;
}

function renderHistory(sorted) {
  const desc = [...sorted].reverse();
  return `<div class="history-card">
    <div class="history-title">측정 기록 (${sorted.length}회)</div>
    <div class="history-list">
      ${desc.map(r => `<div class="history-item">
        <div>
          <div class="history-date">${fmtDate(r.date)}</div>
          <div class="history-values">${METRICS.filter(m => r[m.key] != null).map(m => `${m.label} ${r[m.key]}${m.unit}`).join(' · ') || '입력된 항목 없음'}</div>
        </div>
        <button class="history-del" onclick="deleteRecord('${r.id}')">✕</button>
      </div>`).join('')}
    </div>
  </div>`;
}

function render() {
  const wrap = document.getElementById('mainContent');
  const addBtn = `<button class="btn-add" onclick="openForm()">+ 인바디 기록 추가</button>`;
  if (!records.length) {
    wrap.innerHTML = `${addBtn}<div class="empty-state"><div class="empty-icon">⚖️</div><p class="empty-text">아직 인바디 기록이 없어요.<br>측정 결과를 입력하고 변화를 추적해 보세요.</p></div>`;
    return;
  }
  const sorted = [...records].sort((a, b) => a.date.localeCompare(b.date));
  const charts = METRICS.filter(m => sorted.some(r => r[m.key] != null)).map(m => {
    const latestVal = [...sorted].reverse().find(r => r[m.key] != null);
    return `<div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">${m.label} 추이</span>
        <span class="chart-latest">${latestVal ? latestVal[m.key] : '-'}${m.unit}</span>
      </div>
      ${buildLineChart(sorted, m.key, m.color)}
    </div>`;
  }).join('');
  wrap.innerHTML = `${addBtn}${renderSummary(sorted)}${charts}${renderHistory(sorted)}`;
}

window.openForm = function() {
  document.getElementById('inbodyDate').value = new Date().toISOString().slice(0, 10);
  ['Weight','MuscleMass','BodyFatMass','BodyFatPercent','Bmi','VisceralFat','Bmr'].forEach(f => {
    document.getElementById('inbody' + f).value = '';
  });
  document.getElementById('inbodyPanel').classList.add('open');
};
document.getElementById('btnCloseInbody').onclick = () => document.getElementById('inbodyPanel').classList.remove('open');
document.getElementById('inbodyPanel').onclick = (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); };

document.getElementById('btnSaveInbodyForm').onclick = async () => {
  const date = document.getElementById('inbodyDate').value;
  if (!date) { toast('측정 날짜를 입력해주세요'); return; }
  const num = (id) => {
    const v = document.getElementById(id).value;
    return v === '' ? null : parseFloat(v);
  };
  const data = {
    date,
    weight: num('inbodyWeight'),
    muscleMass: num('inbodyMuscleMass'),
    bodyFatMass: num('inbodyBodyFatMass'),
    bodyFatPercent: num('inbodyBodyFatPercent'),
    bmi: num('inbodyBmi'),
    visceralFat: num('inbodyVisceralFat'),
    bmr: num('inbodyBmr'),
    createdAt: new Date().toISOString(),
  };
  const hasValue = METRICS.some(m => data[m.key] != null);
  if (!hasValue) { toast('최소 한 개 이상의 항목을 입력해주세요'); return; }
  const btn = document.getElementById('btnSaveInbodyForm');
  btn.disabled = true;
  toast('저장 중...');
  try {
    const ref = await addDoc(colRef(), data);
    records.push({ id: ref.id, ...data });
    toast('저장됐어요 ✓');
    document.getElementById('inbodyPanel').classList.remove('open');
    render();
  } catch (e) {
    toast('저장 실패. 다시 시도해주세요.');
  }
  btn.disabled = false;
};

window.deleteRecord = async function(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  try {
    await deleteDoc(doc(colRef(), id));
    records = records.filter(r => r.id !== id);
    render();
    toast('삭제됐어요');
  } catch (e) {
    toast('삭제 실패. 다시 시도해주세요.');
  }
};

const now = new Date();
const weekdays = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
document.getElementById('headerDate').textContent = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${weekdays[now.getDay()]}`;

document.getElementById('btnGoogleLogin').onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { alert('로그인 실패: ' + e.message); }
};

document.getElementById('btnLogout').onclick = async () => {
  if (confirm('로그아웃 하시겠어요?')) await signOut(auth);
};

onAuthStateChanged(auth, async (user) => {
  document.getElementById('screenLoading').style.display = 'none';
  if (user) {
    currentUser = user;
    document.getElementById('screenLogin').style.display = 'none';
    document.getElementById('screenApp').style.display = 'block';
    await loadRecords();
    render();
  } else {
    currentUser = null;
    records = [];
    document.getElementById('screenApp').style.display = 'none';
    document.getElementById('screenLogin').style.display = 'flex';
  }
});
</script>
</body>
</html>
