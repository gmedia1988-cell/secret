<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Secret</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400;500&family=Black+Han+Sans&family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #fdf8f3;
    --surface: #fff;
    --surface2: #faf5ef;
    --text: #2c2420;
    --text2: #8c7b72;
    --text3: #b8a89e;
    --accent: #c8856a;
    --accent-light: #f5ede8;
    --accent-dark: #a06650;
    --border: rgba(180,140,120,0.18);
    --border2: rgba(180,140,120,0.32);
    --shadow: rgba(180,120,80,0.10);
    --font-body: 'Noto Serif KR', serif;
    --font-ui: 'Noto Sans KR', sans-serif;
    --font-size-body: 17px;
    --radius: 20px;
    --radius-sm: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1814;
      --surface: #2a211b;
      --surface2: #231c16;
      --text: #f0e6dc;
      --text2: #a89080;
      --text3: #6e5a50;
      --accent: #d4967e;
      --accent-light: rgba(210,130,90,0.15);
      --border: rgba(180,140,120,0.12);
      --border2: rgba(180,140,120,0.22);
      --shadow: rgba(0,0,0,0.3);
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* 로그인 */
  .login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 32px; text-align: center;
  }
  .login-icon { font-size: 56px; margin-bottom: 20px; }
  .login-title { font-family: var(--font-body); font-size: 28px; color: var(--text); margin-bottom: 10px; letter-spacing: 2px; }
  .login-sub { font-size: 15px; color: var(--text2); line-height: 1.6; margin-bottom: 40px; }
  .btn-google {
    display: flex; align-items: center; gap: 12px; padding: 14px 28px;
    border-radius: var(--radius-sm); background: var(--surface);
    border: 1px solid var(--border2); color: var(--text); font-size: 16px;
    cursor: pointer; transition: all 0.15s; font-family: var(--font-ui);
  }
  .btn-google:active { transform: scale(0.97); }
  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* 로딩 */
  .loading-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px; }
  .spinner { width: 32px; height: 32px; border: 2.5px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--text3); }

  /* 헤더 */
  .app-header {
    position: sticky; top: 0; z-index: 100; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 16px 20px 12px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .app-title { font-family: var(--font-body); font-size: 22px; color: var(--text); letter-spacing: 2px; }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .btn-new {
    width: 38px; height: 38px; border-radius: 50%; background: var(--accent); border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px; font-weight: 300; line-height: 1;
    transition: transform 0.15s, background 0.15s; flex-shrink: 0;
  }
  .btn-new:active { transform: scale(0.92); background: var(--accent-dark); }
  .btn-icon {
    width: 34px; height: 34px; border-radius: 50%; background: none;
    border: 1px solid var(--border2); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text3); font-size: 16px; transition: all 0.15s;
  }
  .btn-icon:active { background: var(--surface2); }
  .header-date { font-size: 13px; color: var(--text3); letter-spacing: 0.3px; }

  /* 탭 */
  .tabs { display: flex; gap: 6px; padding: 12px 20px 0; }
  .tab {
    font-size: 14px; font-family: var(--font-ui); color: var(--text3);
    background: none; border: none; padding: 6px 0; cursor: pointer;
    border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* 뷰 */
  .view { display: none; }
  .view.active { display: block; }

  /* 목록 */
  .list-wrap { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-text { font-family: var(--font-body); color: var(--text3); font-size: 17px; line-height: 1.6; }
  .entry-card {
    background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
    padding: 18px 20px; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s;
    position: relative; overflow: hidden;
  }
  .entry-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--accent); opacity: 0; transition: opacity 0.12s;
  }
  .entry-card:active { transform: scale(0.985); box-shadow: 0 2px 12px var(--shadow); }
  .entry-card:active::before { opacity: 1; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-date { font-size: 12px; color: var(--text3); letter-spacing: 0.3px; }
  .mood-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .card-title { font-family: var(--font-body); font-size: 17px; color: var(--text); margin-bottom: 6px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-preview { font-size: 14px; color: var(--text2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* 에디터 */
  .editor-wrap { padding: 20px 20px 140px; }
  .editor-back {
    display: flex; align-items: center; gap: 6px; background: none; border: none;
    color: var(--accent); font-size: 15px; cursor: pointer; padding: 0; margin-bottom: 20px;
    font-family: var(--font-ui);
  }
  .editor-back svg { width: 18px; height: 18px; }
  .editor-dateline { font-size: 13px; color: var(--text3); margin-bottom: 12px; letter-spacing: 0.3px; }

  /* 감정 */
  .mood-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .mood-btn {
    display: flex; align-items: center; gap: 4px; padding: 6px 11px;
    border-radius: 999px; border: 1px solid var(--border2); background: var(--surface);
    font-size: 12px; color: var(--text2); cursor: pointer; transition: all 0.12s;
    font-family: var(--font-ui);
  }
  .mood-btn.selected { background: var(--accent-light); border-color: var(--accent); color: var(--accent-dark); font-weight: 500; }
  .mood-emoji { font-size: 15px; }

  input.title-input {
    width: 100%; border: none; background: none; font-family: var(--font-body);
    font-size: 22px; color: var(--text); outline: none; padding: 0 0 14px;
    border-bottom: 1px solid var(--border); margin-bottom: 18px;
  }
  input.title-input::placeholder { color: var(--text3); }
  textarea.body-input {
    width: 100%; border: none; background: none;
    font-family: var(--font-body); font-size: var(--font-size-body);
    color: var(--text); outline: none; resize: none; line-height: 1.9;
    min-height: 280px; padding: 0;
  }
  textarea.body-input::placeholder { color: var(--text3); }

  /* 하단 바 */
  .save-bar {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 10px;
  }
  .btn-save {
    flex: 1; padding: 14px; border-radius: var(--radius-sm); background: var(--accent);
    border: none; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: background 0.15s, transform 0.12s; letter-spacing: 0.2px; font-family: var(--font-ui);
  }
  .btn-save:active { transform: scale(0.97); background: var(--accent-dark); }
  .btn-delete {
    padding: 14px 18px; border-radius: var(--radius-sm); background: none;
    border: 1px solid var(--border2); color: var(--text3); font-size: 15px;
    cursor: pointer; transition: all 0.12s; font-family: var(--font-ui);
  }
  .btn-delete:active { background: #fee; color: #c44; border-color: #c44; }

  /* 상세 */
  .detail-title { font-family: var(--font-body); font-size: 24px; color: var(--text); line-height: 1.4; margin-bottom: 20px; }
  .detail-body { font-family: var(--font-body); font-size: var(--font-size-body); color: var(--text); line-height: 1.9; white-space: pre-wrap; word-break: break-word; }
  .detail-mood { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: var(--accent-light); border-radius: 999px; font-size: 13px; color: var(--accent-dark); margin-bottom: 20px; }

  /* 검색 */
  .search-wrap { padding: 12px 20px 0; }
  .search-input {
    width: 100%; padding: 10px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 15px; outline: none; transition: border-color 0.15s; font-family: var(--font-ui);
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }

  /* 통계 */
  .stats-wrap { padding: 20px; }
  .stat-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; margin-bottom: 12px; }
  .stat-label { font-size: 13px; color: var(--text3); margin-bottom: 8px; }
  .stat-value { font-family: var(--font-body); font-size: 28px; color: var(--text); }
  .stat-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .streak-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 12px; }
  .streak-dot { width: 28px; height: 28px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text3); }
  .streak-dot.has-entry { background: var(--accent-light); border-color: var(--accent); color: var(--accent-dark); }
  .mood-chart { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .mood-row-stat { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text2); }
  .mood-bar-bg { flex: 1; height: 8px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
  .mood-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.6s ease; }
  .mood-bar-count { font-size: 12px; color: var(--text3); min-width: 20px; text-align: right; }

  /* 인바디 */
  .inbody-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .inbody-metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
  .inbody-metric-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; }
  .inbody-metric-value { font-family: var(--font-body); font-size: 21px; color: var(--text); }
  .inbody-metric-delta { font-size: 12px; margin-top: 4px; }
  .inbody-metric-delta.good { color: #4caf92; }
  .inbody-metric-delta.bad { color: #d95f5f; }
  .inbody-metric-delta.flat { color: var(--text3); }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; }
  .chart-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .chart-title { font-size: 14px; color: var(--text2); }
  .chart-latest { font-family: var(--font-body); font-size: 19px; color: var(--text); }
  .chart-svg { width: 100%; height: auto; display: block; }
  .chart-axis-label { font-size: 9px; fill: var(--text3); }
  .inbody-history { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .inbody-history-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; }
  .inbody-history-date { font-size: 13px; color: var(--text); font-weight: 500; }
  .inbody-history-values { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .inbody-history-del { background: none; border: none; color: var(--text3); font-size: 15px; cursor: pointer; padding: 4px 8px; flex-shrink: 0; }
  .inbody-history-del:active { color: #c44; }
  .btn-add-inbody {
    width: 100%; padding: 14px; border-radius: var(--radius-sm); background: var(--accent);
    border: none; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    margin-bottom: 16px; font-family: var(--font-ui); transition: background 0.15s, transform 0.12s;
  }
  .btn-add-inbody:active { transform: scale(0.98); background: var(--accent-dark); }
  .inbody-field { margin-bottom: 14px; }
  .inbody-field label { display: block; font-size: 13px; color: var(--text3); margin-bottom: 6px; }
  .inbody-field input {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border2);
    background: var(--surface); color: var(--text); font-size: 16px; outline: none; font-family: var(--font-ui);
  }
  .inbody-field input:focus { border-color: var(--accent); }
  .inbody-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .inbody-grid .inbody-field.full { grid-column: 1 / -1; }
  .inbody-sheet-scroll { max-height: 70vh; overflow-y: auto; }

  /* 설정 패널 */
  .settings-panel {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: flex-end;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .settings-panel.open { opacity: 1; pointer-events: all; }
  .settings-sheet {
    background: var(--bg); border-radius: 24px 24px 0 0; padding: 24px 20px;
    padding-bottom: max(24px, env(safe-area-inset-bottom)); width: 100%;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(.32,.72,0,1);
  }
  .settings-panel.open .settings-sheet { transform: translateY(0); }
  .settings-title { font-family: var(--font-body); font-size: 18px; color: var(--text); margin-bottom: 24px; }
  .settings-section { margin-bottom: 24px; }
  .settings-label { font-size: 13px; color: var(--text3); margin-bottom: 12px; }
  .font-options { display: flex; flex-direction: column; gap: 8px; }
  .font-option {
    padding: 14px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; transition: all 0.12s;
    display: flex; align-items: center; justify-content: space-between;
    color: var(--text); font-size: 16px;
  }
  .font-option.selected { border-color: var(--accent); background: var(--accent-light); }
  .font-option span { font-size: 13px; color: var(--text3); }
  .size-row { display: flex; align-items: center; gap: 12px; }
  .size-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border2);
    background: var(--surface); color: var(--text); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.12s;
    font-family: var(--font-ui);
  }
  .size-btn:active { background: var(--accent-light); border-color: var(--accent); }
  .size-display { flex: 1; text-align: center; font-size: 16px; color: var(--text); }
  .btn-close-settings {
    width: 100%; padding: 14px; border-radius: var(--radius-sm); background: var(--accent);
    border: none; color: #fff; font-size: 16px; cursor: pointer; font-family: var(--font-ui);
  }

  /* 토스트 */
  .saving-toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); font-size: 13px; padding: 8px 18px;
    border-radius: 999px; opacity: 0; transition: opacity 0.2s;
    pointer-events: none; z-index: 999; white-space: nowrap;
  }
  .saving-toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="screenLoading" class="loading-screen">
  <div class="spinner"></div>
  <div class="loading-text">불러오는 중...</div>
</div>

<div id="screenLogin" class="login-screen" style="display:none">
  <div class="login-icon">🤫</div>
  <h1 class="login-title">Secret</h1>
  <p class="login-sub">Google 계정으로 로그인하면<br>어떤 기기에서나 일기를 쓸 수 있어요.</p>
  <button class="btn-google" id="btnGoogleLogin">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Google로 로그인
  </button>
</div>

<div id="screenApp" style="display:none">
  <div class="app-header">
    <div class="header-top">
      <h1 class="app-title">Secret</h1>
      <div class="header-right">
        <button class="btn-icon" id="btnSettings" title="설정">⚙</button>
        <button class="btn-icon" id="btnLogout" title="로그아웃">↩</button>
        <button class="btn-new" id="btnNew" aria-label="새 일기 쓰기">+</button>
      </div>
    </div>
    <div class="header-date" id="headerDate"></div>
  </div>

  <div id="viewList" class="view active">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('all',this)">모두</button>
      <button class="tab" onclick="switchTab('search',this)">검색</button>
      <button class="tab" onclick="switchTab('inbody',this)">인바디</button>
      <button class="tab" onclick="switchTab('stats',this)">통계</button>
    </div>
    <div id="tabAll"><div class="list-wrap" id="entryList"></div></div>
    <div id="tabSearch" style="display:none">
      <div class="search-wrap">
        <input class="search-input" id="searchInput" type="search" placeholder="제목, 내용으로 검색..." oninput="doSearch()" />
      </div>
      <div class="list-wrap" id="searchList"></div>
    </div>
    <div id="tabInbody" style="display:none">
      <div class="stats-wrap" id="inbodyContent"></div>
    </div>
    <div id="tabStats" style="display:none">
      <div class="stats-wrap" id="statsContent"></div>
    </div>
  </div>

  <div id="viewEditor" class="view">
    <div class="editor-wrap">
      <button class="editor-back" id="editorBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        목록으로
      </button>
      <div class="editor-dateline" id="editorDateline"></div>
      <div class="mood-row" id="moodRow"></div>
      <input class="title-input" id="titleInput" type="text" placeholder="제목 없음" maxlength="80" />
      <textarea class="body-input" id="bodyInput" placeholder="오늘 하루는 어땠나요..."></textarea>
    </div>
    <div class="save-bar">
      <button class="btn-delete" id="btnDelete" style="display:none">삭제</button>
      <button class="btn-save" id="btnSave">저장하기</button>
    </div>
  </div>

  <div id="viewDetail" class="view">
    <div class="editor-wrap">
      <button class="editor-back" id="detailBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        목록으로
      </button>
      <div class="editor-dateline" id="detailDateline"></div>
      <div id="detailMood"></div>
      <h2 class="detail-title" id="detailTitle"></h2>
      <div class="detail-body" id="detailBody"></div>
    </div>
    <div class="save-bar">
      <button class="btn-delete" id="btnDetailDelete">삭제</button>
      <button class="btn-save" id="btnEdit">수정하기</button>
    </div>
  </div>
</div>

function formatDate(iso) {
  const d = new Date(iso);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function formatDateShort(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function formatInbodyDate(dateStr) {
  return (dateStr || '').replace(/-/g, '.');

function escHtml(s) {

function renderStats() {
  const wrap = document.getElementById('statsContent');
  if (!entries.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><p class="empty-text">일기를 써야 통계가 보여요!</p></div>`;
    return;
  }
  const total = entries.length;
  const dates = entries.map(e => e.createdAt.slice(0,10));
  const uniqueDates = [...new Set(dates)].sort();
  let streak = 0;
  let checkDate = new Date();
  while (true) {
    const d = checkDate.toISOString().slice(0,10);
    if (dates.includes(d)) { streak++; checkDate.setDate(checkDate.getDate()-1); }
    else break;
  }
  const last7 = [];
  for (let i=6;i>=0;i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    last7.push({ date: d.toISOString().slice(0,10), day: ['일','월','화','수','목','금','토'][d.getDay()] });
  }
  const moodCounts = {};
  entries.forEach(e => { if (e.mood) moodCounts[e.mood] = (moodCounts[e.mood]||0)+1; });
  const maxMood = Math.max(...Object.values(moodCounts), 1);
  wrap.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">총 일기 수</div>
      <div class="stat-value">${total}편</div>
      <div class="stat-sub">첫 일기: ${formatDateShort(uniqueDates[0])}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">현재 연속 작성</div>
      <div class="stat-value">${streak}일</div>
      <div class="stat-sub">최근 7일</div>
      <div class="streak-bar">
        ${last7.map(item => `<div class="streak-dot ${dates.includes(item.date) ? 'has-entry' : ''}">${item.day}</div>`).join('')}

    </div>
    <div class="stat-card">
      <div class="stat-label">감정 분포</div>

            <span style="width:70px;font-size:13px">${m.emoji} ${m.label}</span>
            <div class="mood-bar-bg"><div class="mood-bar-fill" style="width:${pct}%;background:${m.color}"></div></div>
            <span class="mood-bar-count">${cnt}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function buildLineChart(sorted, metricKey, color) {
  const points = sorted.filter(r => r[metricKey] != null).map(r => ({ date: r.date, val: r[metricKey] }));
  if (!points.length) return `<div style="font-size:13px;color:var(--text3);padding:10px 0;text-align:center">데이터 없음</div>`;
  if (points.length === 1) {
    return `<div style="font-size:13px;color:var(--text3);padding:10px 0;text-align:center">기록이 1개 더 있으면 추세가 표시돼요</div>`;
  }
  const width = 300, height = 100, padding = 10, axisSpace = 16;
  const values = points.map(p => p.val);
  let min = Math.min(...values), max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const stepX = (width - padding * 2) / (points.length - 1);
  const coords = points.map((p, i) => ({
    x: padding + i * stepX,
    y: height - padding - ((p.val - min) / (max - min)) * (height - padding * 2),
    val: p.val, date: p.date,
  }));
  const linePath = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaPath = `${linePath} L${coords[coords.length - 1].x.toFixed(1)},${height - padding} L${coords[0].x.toFixed(1)},${height - padding} Z`;
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" style="fill:${color}"><title>${formatInbodyDate(c.date)}: ${c.val}</title></circle>`).join('');
  return `
    <svg class="chart-svg" viewBox="0 0 ${width} ${height + axisSpace}">
      <path d="${areaPath}" style="fill:${color};opacity:0.14;stroke:none"/>
      <path d="${linePath}" style="fill:none;stroke:${color};stroke-width:2"/>
      ${dots}
      <text class="chart-axis-label" x="${padding}" y="${height + 13}">${formatInbodyDate(coords[0].date)}</text>
      <text class="chart-axis-label" x="${width - padding}" y="${height + 13}" text-anchor="end">${formatInbodyDate(coords[coords.length - 1].date)}</text>
    </svg>`;
}

function renderInbodySummary(sorted) {
  const latest = sorted[sorted.length - 1];
  const prev = sorted.length > 1 ? sorted[sorted.length - 2] : null;
  const cards = INBODY_METRICS.filter(m => latest[m.key] != null).map(m => {
    const val = latest[m.key];
    let deltaHtml = '';
    if (prev && prev[m.key] != null) {
      const diff = Math.round((val - prev[m.key]) * 100) / 100;
      const dir = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
      let cls = 'flat';
      if (diff !== 0 && m.goodDirection) cls = dir === m.goodDirection ? 'good' : 'bad';
      const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '–';
      deltaHtml = `<div class="inbody-metric-delta ${cls}">${arrow} ${Math.abs(diff)}${m.unit}</div>`;
    }
    return `<div class="inbody-metric-card">
      <div class="inbody-metric-label">${m.label}</div>
      <div class="inbody-metric-value">${val}${m.unit}</div>
      ${deltaHtml}
    </div>`;
  }).join('');
  return `<div class="inbody-summary-grid">${cards}</div>`;
}

function renderInbodyHistoryList(sorted) {
  const desc = [...sorted].reverse();
  return `<div class="inbody-history">
    ${desc.map(r => `<div class="inbody-history-item">
      <div>
        <div class="inbody-history-date">${formatInbodyDate(r.date)}</div>
        <div class="inbody-history-values">${INBODY_METRICS.filter(m => r[m.key] != null).map(m => `${m.label} ${r[m.key]}${m.unit}`).join(' · ') || '입력된 항목 없음'}</div>
      </div>
      <button class="inbody-history-del" onclick="deleteInbody('${r.id}')">✕</button>
    </div>`).join('')}
  </div>`;
}

function renderInbody() {
  const wrap = document.getElementById('inbodyContent');
  const addBtn = `<button class="btn-add-inbody" onclick="openInbodyForm()">+ 인바디 기록 추가</button>`;
  if (!inbodyRecords.length) {
    wrap.innerHTML = `${addBtn}<div class="empty-state"><div class="empty-icon">⚖️</div><p class="empty-text">아직 인바디 기록이 없어요.<br>측정 결과를 입력하고 변화를 추적해 보세요.</p></div>`;
    return;
  }
  const sorted = [...inbodyRecords].sort((a, b) => a.date.localeCompare(b.date));
  const charts = INBODY_METRICS.filter(m => sorted.some(r => r[m.key] != null)).map(m => {
    const latestVal = [...sorted].reverse().find(r => r[m.key] != null);
    return `<div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">${m.label} 추이</span>
        <span class="chart-latest">${latestVal ? latestVal[m.key] : '-'}${m.unit}</span>
      </div>
      ${buildLineChart(sorted, m.key, m.color)}
    </div>`;
  }).join('');
  wrap.innerHTML = `
    ${addBtn}
    ${renderInbodySummary(sorted)}
    ${charts}
    <div class="stat-card">
      <div class="stat-label">측정 기록 (${sorted.length}회)</div>
      ${renderInbodyHistoryList(sorted)}
    </div>`;
}

window.openInbodyForm = function() {
  document.getElementById('inbodyDate').value = new Date().toISOString().slice(0, 10);
  ['Weight','MuscleMass','BodyFatMass','BodyFatPercent','Bmi','VisceralFat','Bmr'].forEach(f => {
    document.getElementById('inbody' + f).value = '';
  });
  document.getElementById('inbodyPanel').classList.add('open');
};
document.getElementById('btnCloseInbody').onclick = () => document.getElementById('inbodyPanel').classList.remove('open');
document.getElementById('inbodyPanel').onclick = (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); };

document.getElementById('btnSaveInbodyForm').onclick = async () => {
  const date = document.getElementById('inbodyDate').value;
  if (!date) { toast('측정 날짜를 입력해주세요'); return; }
  const num = (id) => {
    const v = document.getElementById(id).value;
    return v === '' ? null : parseFloat(v);
  };
  const data = {
    date,
    weight: num('inbodyWeight'),
    muscleMass: num('inbodyMuscleMass'),
    bodyFatMass: num('inbodyBodyFatMass'),
    bodyFatPercent: num('inbodyBodyFatPercent'),
    bmi: num('inbodyBmi'),
    visceralFat: num('inbodyVisceralFat'),
    bmr: num('inbodyBmr'),
    createdAt: new Date().toISOString(),
  };
  const hasValue = INBODY_METRICS.some(m => data[m.key] != null);
  if (!hasValue) { toast('최소 한 개 이상의 항목을 입력해주세요'); return; }
  const btn = document.getElementById('btnSaveInbodyForm');
  btn.disabled = true;
  toast('저장 중...');
  try {
    const ref = await addDoc(inbodyColRef(), data);
    inbodyRecords.push({ id: ref.id, ...data });
    toast('저장됐어요 ✓');
    document.getElementById('inbodyPanel').classList.remove('open');
    renderInbody();
  } catch (e) {
    toast('저장 실패. 다시 시도해주세요.');
  }
  btn.disabled = false;
};

window.deleteInbody = async function(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  try {
    await deleteDoc(doc(inbodyColRef(), id));
    inbodyRecords = inbodyRecords.filter(r => r.id !== id);
    renderInbody();
    toast('삭제됐어요');
  } catch (e) {
    toast('삭제 실패. 다시 시도해주세요.');
  }
};

const now = new Date();
const weekdays = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
document.getElementById('headerDate').textContent = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${weekdays[now.getDay()]}`;

document.getElementById('bodyInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
});

document.getElementById('btnGoogleLogin').onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e) { alert('로그인 실패: ' + e.message); }
};

document.getElementById('btnLogout').onclick = async () => {
  if (confirm('로그아웃 하시겠어요?')) await signOut(auth);
};

onAuthStateChanged(auth, async (user) => {
  document.getElementById('screenLoading').style.display = 'none';
  if (user) {
    currentUser = user;
    document.getElementById('screenLogin').style.display = 'none';
    document.getElementById('screenApp').style.display = 'block';
    await Promise.all([loadEntries(), loadInbody()]);
  } else {
    currentUser = null;
    entries = [];
    inbodyRecords = [];
    document.getElementById('screenApp').style.display = 'none';
    document.getElementById('screenLogin').style.display = 'flex';
  }
});
</script>
</body>
</html>
